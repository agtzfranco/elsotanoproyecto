services:
  - type: web
    name: elsotano
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: CORREO_STAFF
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_PATH
        sync: false
