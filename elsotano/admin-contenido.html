<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <base href="/" />
    <title>Contenido | El Sótano</title>
    <link rel="icon" type="image/png" sizes="32x32" href="IMG/icono-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="IMG/icono-192.png?v=3" />
    <link rel="apple-touch-icon" href="IMG/icono-180.png?v=3" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="/admin" class="logo-link">
            <img
              src="IMG/ElSotano3offblack.webp"
              alt="El Sótano Logo"
              class="logo-img"
            />
          </a>
          <div class="admin-nav">
            <a href="/" class="admin-ver-sitio" target="_blank" rel="noopener">VER SITIO</a>
            <a href="/admin" class="btn btn-nav">PANEL</a>
          </div>
        </nav>
      </div>
    </header>

    <section id="admin" class="contenido-editor">
      <div class="container">
        <h2>CONTENIDO</h2>
        <p class="admin-hoy">Lo que guardes aquí se ve en la página al momento</p>

        <div class="admin-vista" role="group" aria-label="Qué editar">
          <button data-pestana="precios" class="activo" aria-pressed="true">PRECIOS Y HORARIOS</button>
        </div>

        <div id="pestanaPrecios" class="contenido-pestana">
          <div id="listaServicios"></div>

          <div class="admin-form">
            <h3>HORARIO DE ATENCIÓN</h3>
            <p class="admin-nota">
              El que se ve en la página de inicio (junto al mapa y abajo, en el pie de página).
            </p>
            <div class="form-row contenido-fila">
              <div class="form-group">
                <label for="atDias">Días</label>
                <input type="text" id="atDias" maxlength="60" placeholder="Lunes a domingo" />
              </div>
              <div class="form-group">
                <label for="atAbre">Abre</label>
                <select id="atAbre"></select>
              </div>
              <div class="form-group">
                <label for="atCierra">Cierra</label>
                <select id="atCierra"></select>
              </div>
            </div>
          </div>

          <div class="contenido-guardar">
            <button id="btnGuardar" class="btn btn-full" disabled>GUARDAR CAMBIOS</button>
            <p id="guardarMsg" class="disp-estado" role="status"></p>
          </div>
        </div>
      </div>
    </section>

    <script src="admin-contenido.js?v=1"></script>
  </body>
</html>
