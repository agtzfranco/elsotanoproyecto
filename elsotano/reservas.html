<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva en línea | El Sótano</title>
    <meta name="description" content="Elige fecha y hora y reserva tu sesión en El Sótano en menos de un minuto, sin crear cuenta." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Sótano" />
    <meta property="og:title" content="Reserva en línea | El Sótano" />
    <meta property="og:description" content="Elige fecha y hora y reserva tu sesión en El Sótano en menos de un minuto, sin crear cuenta." />
    <meta property="og:url" content="https://elsotano.onrender.com/reservas.html" />
    <meta property="og:image" content="https://elsotano.onrender.com/IMG/og-imagen.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="IMG/icono-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="IMG/icono-192.png?v=3" />
    <link rel="apple-touch-icon" href="IMG/icono-180.png?v=3" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="index.html" class="logo-link">
            <img
              src="IMG/logo-escalera-texto.png"
              alt="El Sótano Logo"
              class="logo-img"
            />
          </a>
          <ul class="nav-links">
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#equipo">Equipo</a></li>
            <li id="user-area"></li>
          </ul>
          <button class="mobile-menu-btn" aria-label="Abrir menú">☰</button>
        </nav>
      </div>
    </header>

    <section id="booking">
      <div class="container">
        <h2>HAZ TU <span>RESERVACIÓN</span></h2>

        <!-- PASO 1: SERVICIOS -->
        <div id="stepServicio" hidden>
          <h3 class="step-title">
            <span class="step-num">1</span> ELIGE TU SERVICIO
          </h3>
          <div class="services-grid" id="bookingServices"></div>
        </div>

        <!-- PASO 2: FECHA Y HORA -->
        <div class="booking-step" id="stepFecha" hidden>
          <h3 class="step-title">
            <span class="step-num">1</span> ELIGE FECHA Y HORA
            <button
              id="btnCambiarServicio"
              class="btn btn-nav"
              style="margin-left: 1.5rem"
              hidden
            >
              ← CAMBIAR SERVICIO
            </button>
          </h3>
          <div class="booking-calendar-wrap">
            <div class="calendar">
              <div class="cal-header">
                <button id="calPrev" class="cal-nav" aria-label="Mes anterior">
                  ←
                </button>
                <div id="calTitle" class="cal-title"></div>
                <button id="calNext" class="cal-nav" aria-label="Mes siguiente">
                  →
                </button>
              </div>
              <div class="cal-week">
                <span>lun</span><span>mar</span><span>mié</span
                ><span>jue</span><span>vie</span><span>sáb</span
                ><span>dom</span>
              </div>
              <div id="calGrid" class="cal-grid"></div>
            </div>
            <div class="slots-panel">
              <div id="disp-estado" class="disp-estado">
                Selecciona una fecha del calendario.
              </div>
              <div id="slots-grid" class="slots-grid"></div>
            </div>
          </div>
        </div>

        <!-- PASO 3: CONFIRMACIÓN -->
        <div class="booking-step" id="stepConfirm" hidden>
          <h3 class="step-title">
            <span class="step-num">2</span> <span id="confirmTitulo">CONFIRMA TU RESERVA</span>
          </h3>
          <div class="confirm-card">
            <div id="confirmSummary"></div>
            <div class="form-group" id="duracionGroup">
              <label for="duracion">Duración</label>
              <select id="duracion">
                <option value="1" selected>1 hora</option>
                <option value="2">2 horas</option>
                <option value="3">3 horas</option>
                <option value="4">4 horas</option>
                <option value="5">5 horas</option>
                <option value="6">6 horas</option>
                <option value="7">7 horas</option>
                <option value="8">8 horas</option>
              </select>
            </div>
            <div class="form-group">
              <label for="resNombre">Nombre completo</label>
              <input
                type="text"
                id="resNombre"
                autocomplete="name"
                placeholder="Tu nombre"
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="resEmail">Correo electrónico</label>
                <input
                  type="email"
                  id="resEmail"
                  autocomplete="email"
                  placeholder="tu@email.com"
                />
              </div>
              <div class="form-group">
                <label for="resTel">Teléfono</label>
                <input
                  type="tel"
                  id="resTel"
                  autocomplete="tel"
                  placeholder="81 1234 5678"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="mensaje">Notas para el staff (opcional)</label>
              <textarea
                id="mensaje"
                rows="3"
                placeholder="Integrantes, requerimientos, etc."
              ></textarea>
            </div>
            <div id="reglamentoBox" class="reglamento-box" hidden>
              <h4 id="reglamentoTitulo">Reglamento</h4>
              <div id="reglamentoLista"></div>
              <label class="reglamento-acepto">
                <input type="checkbox" id="aceptoReglamento" />
                He leído y acepto el reglamento
              </label>
            </div>
            <div id="confirmMsg" class="disp-estado"></div>
            <button id="btnConfirmar" class="btn btn-full">
              CONFIRMAR RESERVA
            </button>
            <small class="form-hint" style="margin-top: 1rem">
              * Al confirmar aceptas el horario de 11:00 a 23:00 y la política
              de cancelación.
            </small>
          </div>
        </div>
      </div>
    </section>

    <script src="menu.js"></script>
    <script src="auth.js?v=3"></script>
    <script src="reglamentos.js"></script>
    <script src="reservas.js?v=12"></script>
  </body>
</html>
