<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reglamentos | El Sótano</title>
    <meta
      name="description"
      content="Reglamento de la sala de ensayo y del estudio de fotografía de El Sótano."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Sótano" />
    <meta property="og:title" content="Reglamentos | El Sótano" />
    <meta property="og:description" content="Reglas de la sala de ensayo y del estudio de fotografía de El Sótano." />
    <meta property="og:url" content="https://elsotano.onrender.com/reglamentos" />
    <meta property="og:image" content="https://elsotano.onrender.com/IMG/og-imagen.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="IMG/icono-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="IMG/icono-192.png?v=3" />
    <link rel="apple-touch-icon" href="IMG/icono-180.png?v=3" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="/" class="logo-link">
            <img
              src="IMG/ElSotano3offblack.webp"
              alt="El Sótano Logo"
              class="logo-img"
            />
          </a>
          <ul class="nav-links">
            <li><a href="/#servicios">Servicios</a></li>
            <li><a href="/#equipo">Equipo</a></li>
          </ul>
          <button class="mobile-menu-btn" aria-label="Abrir menú">☰</button>
        </nav>
      </div>
    </header>

    <section id="reglamentos">
      <div class="container">
        <h2>REGLAMENTOS</h2>
        <p class="section-intro">
          Para que todos disfrutemos los espacios, te pedimos seguir estas
          reglas durante tu sesión.
        </p>
        <div class="reglamentos-grid">
          <article class="reglamento-card reglamento-oscuro" id="sala-ensayo">
            <h3>Reglamento:<span>Sala de ensayo</span></h3>
            <div data-reglamento="sala-ensayo"></div>
            <img class="reglamento-logo" src="IMG/ElSotano3offblack.webp" alt="El Sótano" />
          </article>
          <article class="reglamento-card reglamento-claro" id="fotografia">
            <h3>Reglamento:<span>Estudio de fotografía</span></h3>
            <div data-reglamento="fotografia"></div>
            <img class="reglamento-logo" src="IMG/ElSotano3offblack.webp" alt="El Sótano" />
          </article>
        </div>
      </div>
    </section>

    <script src="menu.js"></script>
    <script src="reglamentos.js"></script>
    <script>
      document.querySelectorAll("[data-reglamento]").forEach((el) => {
        el.innerHTML = listaReglamento(el.dataset.reglamento);
      });
    </script>
    <script src="visitas.js"></script>
  </body>
</html>
