<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso staff | El Sótano</title>
    <link rel="icon" type="image/png" sizes="32x32" href="IMG/icono-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="IMG/icono-192.png?v=3" />
    <link rel="apple-touch-icon" href="IMG/icono-180.png?v=3" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <a href="index.html" class="logo-link">
            <img
              src="IMG/ElSotano3offblack.png"
              alt="El Sótano Logo"
              class="logo-img"
            />
          </a>
          <ul class="nav-links">
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#equipo">Equipo</a></li>
            <li id="user-area"></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="login-wrap">
      <div class="login-card">
        <span class="sticker">★ SOLO STAFF ★</span>
        <h2>ACCESO <span>STAFF</span></h2>

        <!-- FORM ENTRAR -->
        <form id="loginForm" class="login-form" style="margin-top: 2rem" novalidate>
          <div class="form-group">
            <label for="loginEmail">Correo electrónico</label>
            <input
              type="email"
              id="loginEmail"
              required
              placeholder="tu@email.com"
            />
          </div>
          <div class="form-group">
            <label for="loginPass">Contraseña</label>
            <input
              type="password"
              id="loginPass"
              required
              placeholder="••••••••"
            />
          </div>
          <button type="submit" class="btn btn-full">ENTRAR</button>
        </form>

        <div id="authMsg" class="auth-msg"></div>
      </div>
    </main>

    <script src="login.js?v=2"></script>
  </body>
</html>
